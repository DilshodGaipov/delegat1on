name: Build DELEGAT1ON JAR
on:
  push: { branches: [ main, master ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Код у тебя в подпапке DELEGATION-1.0.8-ddcorp — строим из неё
    defaults:
      run:
        working-directory: DELEGATION-1.0.8-ddcorp
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build with Maven
        run: mvn -U -DskipTests package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: delegat1on-jar
          path: DELEGATION-1.0.8-ddcorp/target/delegat1on-1.0.8-ddcorp.jar
