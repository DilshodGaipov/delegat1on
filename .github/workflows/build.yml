name: Build DELEGAT1ON JAR
on:
  push: { branches: [ main, master ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build with Maven (subfolder)
        run: mvn -U -DskipTests -f DELEGAT1ON-1.0.8-ddcorp/pom.xml package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: delegat1on-jar
          path: DELEGAT1ON-1.0.8-ddcorp/target/delegat1on-1.0.8-ddcorp.jar
